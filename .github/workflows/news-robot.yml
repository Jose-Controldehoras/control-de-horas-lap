name: News robot

on:
  schedule:
    - cron: "17 8,20 * * *"
      timezone: "Europe/Madrid"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: news-robot
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install browser fallback
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium

      - name: Install Spanish OCR
        run: |
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr tesseract-ocr-spa
          tesseract --version
          tesseract --list-langs | grep --fixed-strings spa

      - name: Validate robot
        run: python3 tools/test_x_news_robot.py

      - name: Read the four latest original X posts
        run: python3 tools/x_news_robot.py

      - name: Validate generated JSON
        run: python3 -m json.tool data/noticias.json >/dev/null

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualizar noticias sindicales"
          file_pattern: "data/noticias.json"
