name: Labor values robot

# Revisa cada dia (lunes a sabado) el BOE y todos los boletines del BOP de Granada.
# Publica la tabla salarial y el texto del convenio cuando salen, y abre un aviso
# (issue) con lo que ha hecho o con lo que no ha sabido leer.

on:
  schedule:
    - cron: "23 7 * * 1-6"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update-labor-values:
    runs-on: ubuntu-latest
    concurrency:
      group: labor-values-robot
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF reader
        run: python3 -m pip install --disable-pip-version-check pypdf==6.14.2

      - name: Run labor robot
        run: python3 tools/labor_robot.py

      - name: Validate generated JSON
        run: |
          python3 -m json.tool data/laboral.json >/dev/null
          python3 -m json.tool data/convenio_frutas_granada.json >/dev/null
          python3 -m json.tool data/labor_robot_status.json >/dev/null

      - name: Open notice
        if: hashFiles('robot_report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '\n@Jose-Controldehoras\n' >> robot_report.md
          gh issue create --title "Robot laboral: novedades del $(date +%d/%m/%Y)" --body-file robot_report.md
          rm robot_report.md

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualizar valores laborales oficiales"
          file_pattern: "data/laboral.json data/convenio_frutas_granada.json data/labor_robot_status.json"
